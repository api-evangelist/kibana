    work with your Elasticsearch data.

    Most users will probably want to integrate with Agent Builder using MCP or A2A, but you can also work
    programmatically with tools, agents, and conversations using these Kibana APIs.

    **Elastic Agent Builder requires an Enterprise subscription.**
