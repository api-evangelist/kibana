    Use the Attack discovery APIs to generate and manage Attack discoveries. Attack Discovery leverages
    large language models (LLMs) to analyze alerts in your environment and identify threats. Each "discovery"
    represents a potential attack and describes relationships among multiple alerts to tell you which
    users and hosts are involved, how alerts correspond to the MITRE ATT&CK matrix, and which threat actor
    might be responsible.
