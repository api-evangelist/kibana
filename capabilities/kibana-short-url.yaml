naftiko: 1.0.0-alpha2
info:
  label: Kibana APIs — short url
  description: 'Kibana APIs — short url. 4 operations. Lead operation: Create a short URL. Self-contained Naftiko capability
    covering one Kibana business surface.'
  tags:
  - Kibana
  - short url
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    KIBANA_API_KEY: KIBANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: kibana-short-url
    baseUri: https://{kibana_url}
    description: Kibana APIs — short url business capability. Self-contained, no shared references.
    resources:
    - name: api-short_url
      path: /api/short_url
      operations:
      - name: posturl
        method: POST
        description: Create a short URL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-short_url-_slug-slug
      path: /api/short_url/_slug/{slug}
      operations:
      - name: resolveurl
        method: GET
        description: Resolve a short URL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: slug
          in: path
          type: string
          description: The slug of the short URL.
          required: true
    - name: api-short_url-id
      path: /api/short_url/{id}
      operations:
      - name: deleteurl
        method: DELETE
        description: Delete a short URL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: geturl
        method: GET
        description: Get a short URL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.KIBANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: kibana-short-url-rest
    port: 8080
    description: REST adapter for Kibana APIs — short url. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/short-url
      name: api-short-url
      description: REST surface for api-short_url.
      operations:
      - method: POST
        name: posturl
        description: Create a short URL
        call: kibana-short-url.posturl
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/short-url/slug/{slug}
      name: api-short-url-slug-slug
      description: REST surface for api-short_url-_slug-slug.
      operations:
      - method: GET
        name: resolveurl
        description: Resolve a short URL
        call: kibana-short-url.resolveurl
        with:
          slug: rest.slug
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/short-url/{id}
      name: api-short-url-id
      description: REST surface for api-short_url-id.
      operations:
      - method: DELETE
        name: deleteurl
        description: Delete a short URL
        call: kibana-short-url.deleteurl
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: geturl
        description: Get a short URL
        call: kibana-short-url.geturl
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kibana-short-url-mcp
    port: 9090
    transport: http
    description: MCP adapter for Kibana APIs — short url. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-short-url
      description: Create a short URL
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: kibana-short-url.posturl
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: resolve-short-url
      description: Resolve a short URL
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kibana-short-url.resolveurl
      with:
        slug: tools.slug
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-short-url
      description: Delete a short URL
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: kibana-short-url.deleteurl
      outputParameters:
      - type: object
        mapping: $.
    - name: get-short-url
      description: Get a short URL
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kibana-short-url.geturl
      outputParameters:
      - type: object
        mapping: $.
