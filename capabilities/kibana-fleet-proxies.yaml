        name: putfleetproxiesitemid
        description: Update a proxy
        call: kibana-fleet-proxies.putfleetproxiesitemid
        with:
          kbn-xsrf: rest.kbn-xsrf
          itemId: rest.itemId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
