    baseUri: https://{kibana_url}
    description: Kibana APIs — Fleet proxies business capability. Self-contained, no shared references.
    resources:
    - name: api-fleet-proxies
      path: /api/fleet/proxies
      operations:
      - name: getfleetproxies
        method: GET
        description: Get proxies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: postfleetproxies
        method: POST
        description: Create a proxy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: kbn-xsrf
          in: header
          type: string
          description: A required header to protect against CSRF attacks
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-fleet-proxies-itemId
      path: /api/fleet/proxies/{itemId}
      operations:
      - name: deletefleetproxiesitemid
        method: DELETE
        description: Delete a proxy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: kbn-xsrf
          in: header
          type: string
          description: A required header to protect against CSRF attacks
          required: true
        - name: itemId
          in: path
          type: string
          description: The ID of the proxy
          required: true
      - name: getfleetproxiesitemid
        method: GET
        description: Get a proxy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: itemId
          in: path
          type: string
          description: The ID of the proxy
          required: true
      - name: putfleetproxiesitemid
        method: PUT
        description: Update a proxy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: kbn-xsrf
          in: header
          type: string
          description: A required header to protect against CSRF attacks
          required: true
        - name: itemId
          in: path
          type: string
          description: The ID of the proxy
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.KIBANA_API_KEY}}'
