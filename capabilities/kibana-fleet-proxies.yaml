naftiko: 1.0.0-alpha2
info:
  label: Kibana APIs — Fleet proxies
  description: 'Kibana APIs — Fleet proxies. 5 operations. Lead operation: Get proxies. Self-contained Naftiko capability
    covering one Kibana business surface.'
  tags:
  - Kibana
  - Fleet proxies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
