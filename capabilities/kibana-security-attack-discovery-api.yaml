        - name: sort_order
          in: query
          type: string
          description: Sort order direction `asc` for ascending or `desc` for descending. Defaults to `desc`.
        - name: start
          in: query
          type: string
          description: Start of the time range for the search. Accepts absolute timestamps (ISO 8601) or relative date math
