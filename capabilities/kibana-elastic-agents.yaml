          type: array
          description: Agent IDs to check data for, as an array or comma-separated string
          required: true
        - name: pkgName
          in: query
          type: string
          description: Filter by integration package name
        - name: pkgVersion
          in: query
          type: string
          description: Filter by integration package version
        - name: previewData
