naftiko: 1.0.0-alpha2
info:
  label: Kibana APIs — Message Signing Service
  description: 'Kibana APIs — Message Signing Service. 1 operations. Lead operation: Rotate a Fleet message signing key pair.
    Self-contained Naftiko capability covering one Kibana business surface.'
  tags:
  - Kibana
  - Message Signing Service
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    KIBANA_API_KEY: KIBANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: kibana-message-signing-service
    baseUri: https://{kibana_url}
    description: Kibana APIs — Message Signing Service business capability. Self-contained, no shared references.
    resources:
    - name: api-fleet-message_signing_service-rotate_key_pair
      path: /api/fleet/message_signing_service/rotate_key_pair
      operations:
      - name: postfleetmessagesigningservicerotatekeypair
        method: POST
        description: Rotate a Fleet message signing key pair
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: kbn-xsrf
          in: header
          type: string
          description: A required header to protect against CSRF attacks
          required: true
        - name: acknowledge
          in: query
          type: boolean
          description: Set to true to confirm you understand the risks of rotating the key pair
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.KIBANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: kibana-message-signing-service-rest
    port: 8080
    description: REST adapter for Kibana APIs — Message Signing Service. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/fleet/message-signing-service/rotate-key-pair
      name: api-fleet-message-signing-service-rotate-key-pair
      description: REST surface for api-fleet-message_signing_service-rotate_key_pair.
      operations:
      - method: POST
        name: postfleetmessagesigningservicerotatekeypair
        description: Rotate a Fleet message signing key pair
        call: kibana-message-signing-service.postfleetmessagesigningservicerotatekeypair
        with:
          kbn-xsrf: rest.kbn-xsrf
          acknowledge: rest.acknowledge
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kibana-message-signing-service-mcp
    port: 9090
    transport: http
    description: MCP adapter for Kibana APIs — Message Signing Service. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: rotate-fleet-message-signing-key
      description: Rotate a Fleet message signing key pair
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: kibana-message-signing-service.postfleetmessagesigningservicerotatekeypair
      with:
        kbn-xsrf: tools.kbn-xsrf
        acknowledge: tools.acknowledge
      outputParameters:
      - type: object
        mapping: $.
