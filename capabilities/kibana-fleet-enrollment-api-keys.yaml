    description: Kibana APIs — Fleet enrollment API keys business capability. Self-contained, no shared references.
    resources:
    - name: api-fleet-enrollment_api_keys
      path: /api/fleet/enrollment_api_keys
      operations:
      - name: getfleetenrollmentapikeys
        method: GET
        description: Get enrollment API keys
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: number
          description: Page number
        - name: perPage
          in: query
          type: number
          description: Number of results per page
        - name: kuery
          in: query
          type: string
          description: A KQL query string to filter results
      - name: postfleetenrollmentapikeys
        method: POST
        description: Create an enrollment API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: kbn-xsrf
          in: header
          type: string
          description: A required header to protect against CSRF attacks
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-fleet-enrollment_api_keys-_bulk_delete
      path: /api/fleet/enrollment_api_keys/_bulk_delete
      operations:
      - name: postfleetenrollmentapikeysbulkdelete
        method: POST
        description: Bulk revoke or delete enrollment API keys
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: kbn-xsrf
          in: header
          type: string
          description: A required header to protect against CSRF attacks
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-fleet-enrollment_api_keys-keyId
      path: /api/fleet/enrollment_api_keys/{keyId}
      operations:
      - name: deletefleetenrollmentapikeyskeyid
        method: DELETE
        description: Revoke or delete an enrollment API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: kbn-xsrf
          in: header
          type: string
          description: A required header to protect against CSRF attacks
          required: true
        - name: keyId
          in: path
          type: string
          description: The ID of the enrollment API key
          required: true
        - name: forceDelete
          in: query
          type: boolean
          description: When false (default), invalidate the API key and mark the token as inactive. When true, also delete
            the token document.
        - name: includeHidden
          in: query
          type: boolean
          description: When true, allow deletion of hidden enrollment tokens (managed/agentless policies). Defaults to false.
      - name: getfleetenrollmentapikeyskeyid
        method: GET
        description: Get an enrollment API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: keyId
          in: path
          type: string
          description: The ID of the enrollment API key
          required: true
    authentication:
