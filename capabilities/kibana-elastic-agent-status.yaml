naftiko: 1.0.0-alpha2
info:
  label: Kibana APIs — Elastic Agent status
  description: 'Kibana APIs — Elastic Agent status. 1 operations. Lead operation: Get an agent status summary. Self-contained
    Naftiko capability covering one Kibana business surface.'
  tags:
  - Kibana
  - Elastic Agent status
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    KIBANA_API_KEY: KIBANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: kibana-elastic-agent-status
    baseUri: https://{kibana_url}
    description: Kibana APIs — Elastic Agent status business capability. Self-contained, no shared references.
    resources:
    - name: api-fleet-agent_status
      path: /api/fleet/agent_status
      operations:
      - name: getfleetagentstatus
        method: GET
        description: Get an agent status summary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: policyId
          in: query
          type: string
          description: Filter by agent policy ID
        - name: policyIds
          in: query
          type: array
          description: Filter by one or more agent policy IDs
        - name: kuery
          in: query
          type: string
          description: A KQL query string to filter results
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.KIBANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: kibana-elastic-agent-status-rest
    port: 8080
    description: REST adapter for Kibana APIs — Elastic Agent status. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/fleet/agent-status
      name: api-fleet-agent-status
      description: REST surface for api-fleet-agent_status.
      operations:
      - method: GET
        name: getfleetagentstatus
        description: Get an agent status summary
        call: kibana-elastic-agent-status.getfleetagentstatus
        with:
          policyId: rest.policyId
          policyIds: rest.policyIds
          kuery: rest.kuery
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kibana-elastic-agent-status-mcp
    port: 9090
    transport: http
    description: MCP adapter for Kibana APIs — Elastic Agent status. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-agent-status-summary
      description: Get an agent status summary
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kibana-elastic-agent-status.getfleetagentstatus
      with:
        policyId: tools.policyId
        policyIds: tools.policyIds
        kuery: tools.kuery
      outputParameters:
      - type: object
        mapping: $.
