naftiko: 1.0.0-alpha2
info:
  label: Kibana APIs — observability_ai_assistant
  description: 'Kibana APIs — observability_ai_assistant. 1 operations. Lead operation: Generate a chat completion. Self-contained
    Naftiko capability covering one Kibana business surface.'
  tags:
  - Kibana
  - observability_ai_assistant
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    KIBANA_API_KEY: KIBANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: kibana-observability-ai-assistant
    baseUri: https://{kibana_url}
    description: Kibana APIs — observability_ai_assistant business capability. Self-contained, no shared references.
    resources:
    - name: api-observability_ai_assistant-chat-complete
      path: /api/observability_ai_assistant/chat/complete
      operations:
      - name: observabilityaiassistantchatcomplete
        method: POST
        description: Generate a chat completion
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.KIBANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: kibana-observability-ai-assistant-rest
    port: 8080
    description: REST adapter for Kibana APIs — observability_ai_assistant. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/observability-ai-assistant/chat/complete
      name: api-observability-ai-assistant-chat-complete
      description: REST surface for api-observability_ai_assistant-chat-complete.
      operations:
      - method: POST
        name: observabilityaiassistantchatcomplete
        description: Generate a chat completion
        call: kibana-observability-ai-assistant.observabilityaiassistantchatcomplete
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kibana-observability-ai-assistant-mcp
    port: 9090
    transport: http
    description: MCP adapter for Kibana APIs — observability_ai_assistant. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: generate-chat-completion
      description: Generate a chat completion
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: kibana-observability-ai-assistant.observabilityaiassistantchatcomplete
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
