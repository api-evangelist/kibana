naftiko: 1.0.0-alpha2
info:
  label: Kibana APIs — Fleet service tokens
  description: 'Kibana APIs — Fleet service tokens. 1 operations. Lead operation: Create a service token. Self-contained Naftiko
    capability covering one Kibana business surface.'
  tags:
  - Kibana
  - Fleet service tokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    KIBANA_API_KEY: KIBANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: kibana-fleet-service-tokens
    baseUri: https://{kibana_url}
    description: Kibana APIs — Fleet service tokens business capability. Self-contained, no shared references.
    resources:
    - name: api-fleet-service_tokens
      path: /api/fleet/service_tokens
      operations:
      - name: postfleetservicetokens
        method: POST
        description: Create a service token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: kbn-xsrf
          in: header
          type: string
          description: A required header to protect against CSRF attacks
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.KIBANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: kibana-fleet-service-tokens-rest
    port: 8080
    description: REST adapter for Kibana APIs — Fleet service tokens. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/fleet/service-tokens
      name: api-fleet-service-tokens
      description: REST surface for api-fleet-service_tokens.
      operations:
      - method: POST
        name: postfleetservicetokens
        description: Create a service token
        call: kibana-fleet-service-tokens.postfleetservicetokens
        with:
          kbn-xsrf: rest.kbn-xsrf
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kibana-fleet-service-tokens-mcp
    port: 9090
    transport: http
    description: MCP adapter for Kibana APIs — Fleet service tokens. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-service-token
      description: Create a service token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: kibana-fleet-service-tokens.postfleetservicetokens
      with:
        kbn-xsrf: tools.kbn-xsrf
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
